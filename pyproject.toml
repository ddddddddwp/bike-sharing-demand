[project]
name = "bike-sharing-demand"
version = "0.1.0"
description = "Kaggle Bike Sharing Demand: count regression with time-based validation"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "pyarrow>=14.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
